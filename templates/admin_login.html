<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login | Gupta Tyre House</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #111;

            font-family: Arial, sans-serif;

            color: #111;

        }

        .login-card {

            width: min(420px, 90%);

            padding: 40px;

            background: #fff;

            border-radius: 16px;

            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);

        }

        .logo {

            width: 55px;

            height: 55px;

            margin-bottom: 20px;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #111;

            color: #fff;

            border-radius: 50%;

            font-size: 24px;

        }

        .label {

            color: #d71920;

            font-size: 9px;

            font-weight: 700;

            letter-spacing: 2px;

        }

        h1 {

            margin: 8px 0 8px;

            font-size: 30px;

        }

        .subtitle {

            margin-bottom: 30px;

            color: #777;

            font-size: 13px;

        }

        .form-group {

            margin-bottom: 18px;

        }

        label {

            display: block;

            margin-bottom: 7px;

            font-size: 11px;

            font-weight: 700;

        }

        input {

            width: 100%;

            padding: 14px;

            border: 1px solid #ddd;

            border-radius: 7px;

            background: #fafafa;

            outline: none;

            font-size: 13px;

        }

        input:focus {

            border-color: #d71920;

            background: #fff;

        }

        button {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 7px;

            background: #d71920;

            color: white;

            font-size: 12px;

            font-weight: 700;

            cursor: pointer;

        }

        button:hover {

            background: #b9141a;

        }

        .error {

            margin-bottom: 18px;

            padding: 12px;

            border-radius: 7px;

            background: #fff0f0;

            color: #c4161c;

            font-size: 11px;

        }

        .back {

            display: block;

            margin-top: 20px;

            color: #777;

            font-size: 11px;

            text-align: center;

            text-decoration: none;

        }

        .back:hover {

            color: #111;

        }

    </style>

</head>


<body>

    <div class="login-card">

        <div class="logo">
            🛞
        </div>

        <span class="label">
            GUPTA TYRE HOUSE
        </span>

        <h1>
            Admin Login
        </h1>

        <p class="subtitle">
            Sign in to manage customer enquiries.
        </p>


        {% if error %}

        <div class="error">
            {{ error }}
        </div>

        {% endif %}


        <form
            method="POST"
            action="/admin/login"
        >

            <div class="form-group">

                <label for="username">
                    USERNAME
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter username"
                    required
                    autocomplete="username"
                >

            </div>


            <div class="form-group">

                <label for="password">
                    PASSWORD
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter password"
                    required
                    autocomplete="current-password"
                >

            </div>


            <button type="submit">
                LOGIN TO DASHBOARD →
            </button>

        </form>


        <a
            href="/"
            class="back"
        >
            ← Back to Gupta Tyre House
        </a>

    </div>

</body>

</html>
